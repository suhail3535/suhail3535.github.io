<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08090d" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Suhail Khan — Senior Full Stack Developer</title>
    <meta
      name="description"
      content="Suhail Khan — Senior Full Stack Developer in Jaipur, India. I build fast, reliable web apps for media and finance teams in React, Next.js, Node.js and Ruby on Rails — 4+ years shipping production software behind Gulf News, Fortune India and Khaleej Times. Available for freelance projects."
    />
    <meta name="author" content="Suhail Khan" />
    <link rel="canonical" href="https://www.suhailkhandev.site/" />

    <!-- Open Graph / social preview. URLs must be absolute and on the live
         domain: scrapers don't resolve relative paths, and the retired
         github.io host still serves a stale build. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Suhail Khan" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.suhailkhandev.site/" />
    <meta property="og:title" content="Suhail Khan — Senior Full Stack Developer" />
    <meta
      property="og:description"
      content="I build fast, reliable web apps for media and finance teams. React, Next.js, Node.js, Ruby on Rails, PostgreSQL. Available for freelance projects."
    />
    <meta property="og:image" content="https://www.suhailkhandev.site/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Suhail Khan, senior full-stack developer — I build fast, reliable web apps for media and finance teams."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Suhail Khan — Senior Full Stack Developer" />
    <meta
      name="twitter:description"
      content="I build fast, reliable web apps for media and finance teams. React, Next.js, Node.js, Ruby on Rails, PostgreSQL."
    />
    <meta name="twitter:image" content="https://www.suhailkhandev.site/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Suhail Khan, senior full-stack developer."
    />

    <!-- Fonts: App.css previously asked for "Exo" but nothing ever loaded it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Resolve the theme before first paint so the page never flashes the
         wrong one. Dark is the default; only an explicit choice overrides it. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("theme") === "light") {
            theme = "light";
          }
        } catch (err) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
